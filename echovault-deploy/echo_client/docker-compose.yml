services:
  # Service name "client" → DNS name the proxy routes to (client:3000).
  client:
    image: echo_client:1.0
    build:
      context: .
      args:
        # API base the browser fetches /pubkey from (through the proxy, over
        # TLS). page.tsx derives the WebSocket URL from it: https → wss.
        NEXT_PUBLIC_API_URL: https://echo.server.test
    container_name: echo_client
    restart: unless-stopped
    # No host ports: ingress is mitmproxy only. Uncomment for local debugging:
    # ports:
    #   - "3000:3000"
    networks:
      - proxynet

networks:
  proxynet:
    external: true
    name: proxynet
