services:
  # Service name "server" → becomes the DNS name the proxy routes to (server:8000).
  server:
    image: echo_server:1.0
    build: .                      # used only when you build locally; ignored if the image is preloaded
    container_name: echo_server
    restart: unless-stopped
    # No host ports published on purpose: the ONLY public ingress is mitmproxy.
    # The server is reachable only from inside proxynet (by the proxy container).
    # Uncomment for local debugging:
    # ports:
    #   - "8000:8000"
    networks:
      - proxynet

networks:
  proxynet:
    external: true
    name: proxynet
