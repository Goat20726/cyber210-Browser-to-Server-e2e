services:
  mitmproxy:
    image: mitmproxy/mitmproxy
    container_name: mitmproxy
    restart: unless-stopped
    # Reverse proxy + TLS termination.
    #   * Terminates TLS on the listen port using OUR cert (echovault.pem),
    #     which has a SAN for both echo.client.test and echo.server.test.
    #   * route.py rewrites the upstream per-vhost (see that file), so this one
    #     proxy fronts BOTH the Next.js client and the FastAPI server.
    #   * Traffic to the backends is plain http/ws — nothing is re-encrypted,
    #     which is the whole point of the TLS-vs-E2E exhibit: with E2E OFF the
    #     prompt shows up here in cleartext; with E2E ON you see only ciphertext.
    #
    # We listen on 8080 INSIDE the container and publish it as host :443, so we
    # never need to bind a privileged port inside the container.
   command: >
      mitmweb
      --mode reverse:http://client:3000
      --certs /certs/echovault.pem
      -s /addons/route.py
      -s /addons/tamper_client_code.py
      --listen-host 0.0.0.0
      --listen-port 8080
      --web-host 0.0.0.0
      --web-port 8081
      --no-web-open-browser
      --set web_password="Pa44word1234"
      --set keep_host_header=true
      --set connection_strategy=lazy
    ports:
      - "443:8080"    # HTTPS entrypoint  ^f^r browse https://echo.client.test
      - "8081:8081"   # mitmweb UI        ^f^r http://<box-ip>:8081 (password above)
    tty: true
    stdin_open: true
    volumes:
      - ./certs:/certs:ro          # echovault.pem (TLS) + ca.crt live here
      - ./route.py:/addons/route.py:ro
      - ./tamper_client_code.py:/addons/tamper_client_code.py:ro
    networks:
      - proxynet

networks:
  proxynet:
    external: true
    name: proxynet
